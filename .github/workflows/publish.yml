name: Publish @accensa/sdk

on:
  push:
    tags:
      - '@accensa/sdk@*'

jobs:
  build-and-test:
    name: build & test SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build
      - name: Test SDK
        working-directory: ./packages/sdk
        run: pnpm test
      - name: Typecheck SDK
        working-directory: ./packages/sdk
        run: pnpm typecheck
      # Same check as CI's "Verify the vendored conformance vectors match their
      # committed hash": the canonical fixture is vendored byte-for-byte from
      # accensa-contracts, so publishing must start from a file that matches its
      # committed hash. There is no generator in this repo to re-run.
      - name: Verify the vendored conformance vectors match their committed hash
        working-directory: ./packages/sdk
        run: sha256sum -c merkle-vectors.json.sha256

  verify-pack:
    name: verify tarball
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build
      - name: Pack SDK tarball
        working-directory: ./packages/sdk
        run: pnpm pack --pack-destination /tmp/sdk-tarball
      - name: Verify tarball installs and imports in ESM and CJS
        run: |
          TARBALL=$(ls /tmp/sdk-tarball/*.tgz)

          # Create scratch project outside the workspace
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y > /dev/null 2>&1
          npm install "$TARBALL" > /dev/null 2>&1

          # Test CJS import
          node -e "
            const sdk = require('@accensa/sdk');
            if (typeof sdk.verifyReceipt !== 'function') throw new Error('verifyReceipt not exported');
            if (typeof sdk.attachAccensaHook !== 'function') throw new Error('attachAccensaHook not exported');
            if (typeof sdk.createSettleHook !== 'function') throw new Error('createSettleHook not exported');
            console.log('CJS: root entry OK');
          "

          # Test CJS merkle import
          node -e "
            const merkle = require('@accensa/sdk/merkle');
            if (typeof merkle.verifyReceipt !== 'function') throw new Error('verifyReceipt not exported from /merkle');
            console.log('CJS: merkle entry OK');
          "

          # Test ESM import
          cat > "$SCRATCH/test.mjs" << 'EOF'
          import { verifyReceipt, attachAccensaHook, createSettleHook } from '@accensa/sdk';
          import { verifyReceipt as vr } from '@accensa/sdk/merkle';

          if (typeof verifyReceipt !== 'function') throw new Error('verifyReceipt not exported');
          if (typeof attachAccensaHook !== 'function') throw new Error('attachAccensaHook not exported');
          if (typeof createSettleHook !== 'function') throw new Error('createSettleHook not exported');
          if (typeof vr !== 'function') throw new Error('verifyReceipt not exported from /merkle');
          console.log('ESM: both entries OK');
          EOF
          node "$SCRATCH/test.mjs"

          echo "All import checks passed"

      - name: Verify packed engines field requires Node 22
        run: |
          TARBALL=$(ls /tmp/sdk-tarball/*.tgz)
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          tar -xzf "$TARBALL" --strip-components=1 package/package.json
          ENGINE=$(node -e "const p=require('./package.json'); process.stdout.write(p.engines && p.engines.node || '')")
          if [ "$ENGINE" != ">=22" ]; then
            echo "::error::packed engines.node = '$ENGINE', want '>=22'"
            exit 1
          fi
          echo "engines.node = $ENGINE — OK"

      - name: Run node --check over packed dist files
        run: |
          TARBALL=$(ls /tmp/sdk-tarball/*.tgz)
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          tar -xzf "$TARBALL" package/dist
          find package/dist -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || { echo "::error::node --check failed for $f"; exit 1; }
          done
          echo "node --check passed for all dist files"

  publish:
    name: publish to npm
    needs: verify-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build
      - name: Publish with provenance
        working-directory: ./packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
