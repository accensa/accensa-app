name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Lints apps/web and packages/sdk from the root.
      # apps/docs (Docusaurus) and apps/demo-merchant (example JS) are excluded.
      - name: Lint workspace packages
        run: pnpm lint

  test-sdk:
    name: test (sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test SDK
        working-directory: ./packages/sdk
        run: pnpm test
      - name: Verify generated API types are reproducible
        run: |
          pnpm --filter @accensa/sdk gen:api
          git diff --exit-code -- packages/sdk/generated/api-types.ts
      - name: Verify conformance vectors are reproducible
        run: |
          node packages/sdk/scripts/generate-vectors.mjs
          git diff --exit-code -- packages/sdk/merkle-vectors.json packages/sdk/vectors.rs

  test-web:
    name: test (web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accensa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test web
        working-directory: ./apps/web
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/accensa_test
        run: pnpm test

  test-reconcile:
    name: test (reconcile-payments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Unit tests only: synthetic and fixture data, no live RPC or database.
      # The live reconciliation itself runs on a schedule, in reconcile.yml.
      - name: Test reconcile-payments
        working-directory: ./scripts/reconcile-payments
        run: pnpm test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Typechecks apps/web and packages/sdk from the root.
      # apps/docs (Docusaurus) uses its own tsconfig via @docusaurus/tsconfig
      # and is excluded — its types are checked by docusaurus build instead.
      # apps/demo-merchant is plain JavaScript and has no TypeScript to check.
      - name: Typecheck workspace packages
        run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Next.js app
        working-directory: ./apps/web
        run: pnpm build
