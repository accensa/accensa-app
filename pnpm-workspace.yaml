packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts/*'
# `@next/bundle-analyzer`'s `index.d.ts` does `import type { NextConfig } from
# 'next'` but its package.json declares no `next` peer, so TypeScript resolves
# that import by walking up out of the package into pnpm's hidden hoist store.
# Declaring the missing peer makes pnpm link each importer's own `next` into the
# analyzer, so resolution stops at the right one for every workspace app.
packageExtensions:
  '@next/bundle-analyzer':
    peerDependencies:
      next: '*'
allowBuilds:
  '@reown/appkit': false
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: false
  core-js: true
  core-js-pure: true
  esbuild: true
  secp256k1: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - serialize-javascript@7.0.3 || 7.0.5
  - vite@6.4.2 || 6.4.3
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - uuid@11.1.1
  - vitest@3.2.6
  - axios@1.18.0
  - fast-uri@3.1.4 || 3.1.5
  - sharp@0.35.0
  - next@16.2.11
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.8 || 5.0.9
